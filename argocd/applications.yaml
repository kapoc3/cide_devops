apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  project: default
  source:
    path: terraform
    repoURL: https://github.com/kapoc3/cide_devops
    targetRevision: develop
  destination:
    server: https://kubernetes.default.svc
    namespace: cide-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
