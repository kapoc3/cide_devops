version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--web.enable-lifecycle'
    ports:
      - "19090:9090"
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "13000:3000"
    volumes:
      - ./docker/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
    networks:
      - observability-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "13100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/observability/tempo/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "13200:3200"
    networks:
      - observability-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
      - "8889:8889" # prometheus exporter
    networks:
      - observability-network

  helloworldapi:
    build:
      context: ./HelloWorldApi
      dockerfile: Dockerfile
    container_name: helloworldapi
    ports:
      - "8086:8080"
    environment:
      - Otlp__Endpoint=http://otel-collector:4317
    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge
