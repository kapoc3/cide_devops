version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--web.enable-lifecycle'
    ports:
      - "19090:9090"
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "13000:3000"
    volumes:
      - ./docker/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
    networks:
      - observability-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "13100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/observability/tempo/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "13200:3200"
    networks:
      - observability-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
      - "8889:8889" # prometheus exporter
    networks:
      - observability-network

  postgres-auth:
    image: postgres:17
    container_name: postgres-auth-extension
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin123}
      - POSTGRES_DB=${DB_NAME:-clients-auth-extension}
    ports:
      - "15432:5432"
    networks:
      - observability-network

  kpt-auth-client-back:
    image: kpt-auth-client-back:latest
    container_name: kpt-auth-client-back
    ports:
      - "8091:8091"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-keycloak}
      - AUTH_KEYCLOAK_URL=${AUTH_KEYCLOAK_URL}
      - AUTH_KEYCLOAK_REALM=${AUTH_KEYCLOAK_REALM}
      - AUTH_KEYCLOAK_CLIENT_ID=${AUTH_KEYCLOAK_CLIENT_ID}
      - AUTH_KEYCLOAK_CLIENT_SECRET=${AUTH_KEYCLOAK_CLIENT_SECRET}
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=${OTLP_ENDPOINT}/v1/logs
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${OTLP_ENDPOINT}/v1/traces
      - MANAGEMENT_OTLP_METRICS_EXPORT_URL=${OTLP_ENDPOINT}/v1/metrics
      - OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED=${OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED:-false}
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_KUSPIT=${LOGGING_LEVEL_COM_KUSPIT:-DEBUG}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:-INFO}
      - SPRING_RABBITMQ_HOST=host.docker.internal
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres-auth:5432/clients-auth-extension}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-admin123}
      - KPT_NOTIFICATION_URL=${KPT_NOTIFICATION_URL:-http://host.docker.internal:8082}
      - KPT_NOTIFICATION_CHANNEL_ID=${KPT_NOTIFICATION_CHANNEL_ID:-DEFAULT_CHANNEL}
    networks:
      - observability-network
    depends_on:
      - postgres-auth

  helloworldapi:
    build:
      context: ./HelloWorldApi
      dockerfile: Dockerfile
    container_name: helloworldapi
    ports:
      - "8086:8080"
    environment:
      - Otlp__Endpoint=http://otel-collector:4317
    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge
